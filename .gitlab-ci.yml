variables:
  PKG_TARGET: deenesse
stages:
  - build-package
  - publish

debian:
  stage: build-package
  needs: []
  image:
    name: debian:trixie-backports
    pull_policy: if-not-present
  artifacts:
    when: always
    paths: [ deenesse.deb ]
  script:
    - mkdir -p packages/Debian/${PKG_TARGET}/usr/bin
    - mv ${PKG_TARGET}.py packages/Debian/${PKG_TARGET}/usr/bin/${PKG_TARGET}
    - echo "Setting Permissions"
    - chmod +x packages/Debian/${PKG_TARGET}/usr/bin/${PKG_TARGET}
    - chmod 755 packages/Debian/${PKG_TARGET}/DEBIAN -R
    - echo "Creating Deb Package"
    - dpkg-deb --root-owner-group --build packages/Debian/${PKG_TARGET} ${PKG_TARGET}.deb

publish:
  stage: publish
  needs:
    - job: debian
      artifacts: true
  image:
    name: debian:trixie-backports
    pull_policy: if-not-present
  before_script:
    - apt update
    - apt install curl -y
  script:
    - |
      curl --fail-with-body \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file ${PKG_TARGET}.deb \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Debian/${CI_COMMIT_TAG}/${PKG_TARGET}-${CI_COMMIT_TAG}.deb"
  rules:
    - if: $CI_COMMIT_TAG
