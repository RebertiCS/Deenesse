name: Build debian package

on:
  push:
    branches:
      - main
    tags:
      - "v**"

jobs:
  build-deb:
    name: Create Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v3

      - name: Get package version
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_control=${TAG:1}" >> "$GITHUB_OUTPUT"

      - name: Go Setup
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Go Build
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        run: |
          go build -ldflags "-w -s -X main.Version=${{ steps.meta.outputs.tag_control }}" .

      - name: Copy binary and update control package version
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p debian/usr/bin/
          cp deenesse debian/usr/bin/deenesse
          sed -i -r "s/Version:.*/Version: ${{ steps.meta.outputs.tag_control }}/" debian/DEBIAN/control

          chmod 755 debian/ -R
          chmod +x debian/usr/bin/deenesse

          dpkg-deb --root-owner-group --build debian deenesse-${{ steps.meta.outputs.tag }}.deb

      - name: Upload debian package to release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          overwrite: true
          make_latest: true
          file_glob: true

          asset_name: deenesse
          file: deenesse-${{ steps.meta.outputs.tag }}.deb
