stages:
  - build-package
  - publish

debian:
  stage: build-package
  needs: []
  image:
    name: debian:trixie-backports
    pull_policy: if-not-present
  artifacts:
    when: always
    paths: [ deenesse.deb ]
  script:
    - mkdir -p packages/Debian/deenesse/usr/bin
    - mv deenesse.py packages/Debian/deenesse/usr/bin/deenesse
    - echo "Setting Permissions"
    - chmod +x packages/Debian/deenesse/usr/bin/deenesse
    - chmod 755 packages/Debian/deenesse/DEBIAN -R
    - echo "Creating Deb Package"
    - dpkg-deb --root-owner-group --build packages/Debian/deenesse deenesse.deb

publish:
  stage: publish
  needs:
    - job: debian
      artifacts: true
  image:
    name: debian:trixie-backports
    pull_policy: if-not-present
  script:
    - |
      curl --fail-with-body \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file deenesse.deb \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/deenesse/${CI_COMMIT_TAG}/deenesse.deb"
  rules:
    - if: $CI_COMMIT_TAG
